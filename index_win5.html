<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN5予想 (スコアリング+荒れ度配分)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .w5-container { max-width: 1100px; margin: 0 auto; padding: 16px; }
        .w5-section { background: rgba(0,0,0,0.25); border: 1px solid var(--border-color);
                      border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .w5-step-title { font-size: 16px; font-weight: bold; color: var(--primary);
                         margin-bottom: 10px; }
        .w5-progress { color: var(--text-muted); margin: 8px 0; }
        .w5-score-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
        .w5-score-table th, .w5-score-table td { border: 1px solid var(--border-color);
                                                 padding: 4px 8px; text-align: center; }
        .w5-score-table td.name { text-align: left; }
        .upset-badge { display: inline-block; padding: 2px 10px; border-radius: 10px;
                       font-weight: bold; font-size: 12px; margin-left: 6px; }
        .upset-S { background: #d32f2f; color: #fff; }
        .upset-A { background: #f57c00; color: #fff; }
        .upset-B { background: #fbc02d; color: #333; }
        .upset-C { background: #388e3c; color: #fff; }
        .upset-N { background: #555; color: #eee; }
        .w5-pick-row { border: 1px solid var(--border-color); border-radius: 8px;
                       padding: 10px 14px; margin-bottom: 8px; }
        .w5-pick-horses { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
        .w5-horse-chip { background: rgba(255,255,255,0.08); border: 1px solid var(--border-color);
                         border-radius: 6px; padding: 3px 10px; font-size: 13px; }
        .w5-horse-chip b { color: var(--primary); }
        .w5-formula { font-size: 20px; font-weight: bold; color: var(--primary); margin: 10px 0 4px; }
        .w5-est { color: var(--text-muted); font-size: 13px; }
        .w5-race-head { font-weight: bold; }
        .w5-selected-row { background: rgba(80, 200, 120, 0.10); }
        .score-detail-btn { cursor: pointer; color: var(--primary); background: none;
                            border: none; font-size: 12px; }
        .w5-detail-pre { font-size: 11px; color: var(--text-muted); text-align: left;
                         white-space: pre-wrap; margin: 2px 0 0; }
    </style>
</head>
<body>
<div class="w5-container">
    <h2 style="margin: 12px 0;">WIN5予想 <span style="font-size:13px;color:var(--text-muted);">スコアリング + 荒れ度配分 (ローカル専用)</span></h2>

    <!-- STEP 1 -->
    <div class="w5-section">
        <div class="w5-step-title">STEP 1: WIN5対象レース取得</div>
        <button class="primary-btn" id="loadBtn" onclick="loadRaces()">対象レースを取得</button>
        <span class="w5-progress" id="loadStatus"></span>
        <div class="win5-race-grid" id="raceGrid" style="margin-top:12px;"></div>
    </div>

    <!-- STEP 2 -->
    <div class="w5-section">
        <div class="w5-step-title">STEP 2: スコア計算 (5レース順次・数分かかります)</div>
        <button class="primary-btn" id="analyzeBtn" onclick="analyzeAll()" disabled>スコア計算開始</button>
        <span class="w5-progress" id="analyzeStatus"></span>
        <div id="scoreArea"></div>
    </div>

    <!-- STEP 3 -->
    <div class="w5-section">
        <div class="w5-step-title">STEP 3: 買い目生成</div>
        <div style="margin-bottom:10px;">
            点数上限:
            <label class="win5-radio-label"><input type="radio" name="pts" value="50"> 50点</label>
            <label class="win5-radio-label"><input type="radio" name="pts" value="100" checked> 100点</label>
            <label class="win5-radio-label"><input type="radio" name="pts" value="150"> 150点</label>
            <label class="win5-radio-label"><input type="radio" name="pts" value="200"> 200点</label>
        </div>
        <div style="margin-bottom:10px;">
            <label class="win5-radio-label">
                <input type="checkbox" id="singleAxis">
                最も確度が高いレースを1頭固定 (軸) — 浮いた点数を他レースに配分
            </label>
            <span style="color:var(--text-muted);font-size:11px;">
                ※バックテスト(2021-2025・MLスコア): 軸1頭固定が全点数で的中率優位 (軸馬勝率39.9%)。推奨ON
            </span>
        </div>
        <button class="primary-btn" id="kaimeBtn" onclick="generateKaime()" disabled>買い目を生成</button>
        <div id="kaimeArea" style="margin-top:12px;"></div>
    </div>

    <!-- STEP 4 -->
    <div class="w5-section">
        <div class="w5-step-title">STEP 4: 締切前の自動再計算 (推奨)</div>
        <div style="color:var(--text-muted);font-size:13px;margin-bottom:8px;">
            MLスコアの最重要因子はオッズのため、購入直前の再計算ほど精度が出ます (バックテストは確定オッズ基準)。
            1レース目発走の15分前に全5レースのオッズを再取得して買い目を計算し直し、ブラウザ通知します。
        </div>
        <button class="primary-btn" onclick="armWatch()">⏰ 自動再計算を予約</button>
        <span class="w5-progress" id="watchStatus"></span>
        <div id="watchArea" style="margin-top:12px;"></div>
    </div>
</div>

<script>
let raceList = [];      // STEP1 の5レース {venue, race_num, time, url}
let analyzed = [];      // STEP2 の解析結果 (idx順)

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function upsetBadge(rank) {
    const r = rank || '?';
    const cls = ['S','A','B','C'].includes(r) ? `upset-${r}` : 'upset-N';
    return `<span class="upset-badge ${cls}">荒れ度 ${esc(r)}</span>`;
}

// ── STEP 1 ──────────────────────────────────────────────
async function loadRaces() {
    const st = document.getElementById('loadStatus');
    st.textContent = '取得中...';
    document.getElementById('loadBtn').disabled = true;
    try {
        const res = await fetch('api/win5_races');
        const data = await res.json();
        const grid = document.getElementById('raceGrid');
        grid.innerHTML = '';
        if (!data.success) {
            st.textContent = data.error || '取得失敗';
            raceList = Array.from({length: 5}, (_, i) => ({idx: i, venue: '?', race_num: '?', time: '', url: ''}));
        } else {
            st.textContent = `対象日: ${data.date || ''}`;
            raceList = data.races;
        }
        raceList.forEach((r, i) => {
            const found = !!r.url;
            grid.insertAdjacentHTML('beforeend', `
                <div class="win5-race-card">
                    <div class="win5-race-no">WIN5-${i + 1}</div>
                    <div class="win5-race-venue">${esc(r.venue)} ${esc(r.race_num)}R</div>
                    <div class="win5-race-time">${esc(r.time || '')}</div>
                    <div class="win5-url-status">${found ? '✅ URL自動取得' : '⚠️ URLを入力してください'}</div>
                    <input class="win5-url-input" id="url${i}" value="${esc(r.url)}" placeholder="accessD.html?CNAME=...">
                </div>`);
        });
        document.getElementById('analyzeBtn').disabled = false;
    } catch (e) {
        st.textContent = 'エラー: ' + e.message;
    } finally {
        document.getElementById('loadBtn').disabled = false;
    }
}

// ── STEP 2 ──────────────────────────────────────────────
async function analyzeAll() {
    const st = document.getElementById('analyzeStatus');
    const area = document.getElementById('scoreArea');
    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    area.innerHTML = '';
    analyzed = [];
    for (let i = 0; i < 5; i++) {
        const url = (document.getElementById(`url${i}`)?.value || '').trim();
        if (!url) {
            st.textContent = `WIN5-${i + 1} のURLが未入力です`;
            btn.disabled = false;
            return;
        }
        st.textContent = `解析中... ${i + 1}/5 (${raceList[i]?.venue || ''})`;
        try {
            const res = await fetch('api/win5_analyze_one', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({idx: i, url})
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            analyzed[i] = data;
            renderRaceScores(area, i, data);
        } catch (e) {
            st.textContent = `WIN5-${i + 1} 解析失敗: ${e.message}`;
            btn.disabled = false;
            return;
        }
    }
    const logWarnings = analyzed.filter(x => x?.logging_warning).length;
    st.textContent = logWarnings ? `5レース完了 / ⚠ ログ保存失敗 ${logWarnings}件` : '5レース完了';
    btn.disabled = false;
    document.getElementById('kaimeBtn').disabled = false;
}

function renderRaceScores(area, i, data) {
    const horses = [...(data.horses || [])].sort((a, b) => (b.score ?? -999) - (a.score ?? -999));
    const rows = horses.map((h, ri) => `
        <tr id="r${i}h${h.num}">
            <td>${ri + 1}</td><td>${esc(h.num)}</td>
            <td class="name">${esc(h.name)}
                ${h.score_details?.length ? `<button class="score-detail-btn" onclick="toggleDetail(${i},${h.num})">[内訳]</button>
                <pre class="w5-detail-pre" id="d${i}h${h.num}" style="display:none;">${esc(h.score_details.join('\n'))}</pre>` : ''}
            </td>
            <td>${h.score ?? '-'}</td><td>${esc(h.grade || '-')}</td>
            <td>${esc(h.odds)}</td><td>${esc(h.pop || '-')}</td><td>${esc(h.jock)}</td>
        </tr>`).join('');
    area.insertAdjacentHTML('beforeend', `
        <div style="margin-top:14px;">
            <div class="w5-race-head">WIN5-${i + 1}: ${esc(data.race_info)} ${upsetBadge(data.upset_rank)}
                <span style="color:var(--text-muted);font-size:12px;">(荒れ指数 ${data.upset_score ?? '-'})</span>
            </div>
            <table class="w5-score-table">
                <tr><th>順</th><th>馬番</th><th>馬名</th><th>スコア</th><th>判定</th><th>オッズ</th><th>人気</th><th>騎手</th></tr>
                ${rows}
            </table>
        </div>`);
}

function toggleDetail(i, num) {
    const el = document.getElementById(`d${i}h${num}`);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ── STEP 3 ──────────────────────────────────────────────
async function generateKaime() {
    const pts = document.querySelector('input[name="pts"]:checked').value;
    const area = document.getElementById('kaimeArea');
    area.innerHTML = '生成中...';
    try {
        const singleAxis = document.getElementById('singleAxis').checked;
        const res = await fetch('api/win5_kaime', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({points: Number(pts), races: analyzed, single_axis: singleAxis})
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        renderKaimeData(data, area);
        if (data.logging_warning) {
            area.insertAdjacentHTML('afterbegin', `<div style="color:#ffb347;margin-bottom:8px;">⚠ ログ保存失敗: ${esc(data.logging_warning)}</div>`);
        }
    } catch (e) {
        area.innerHTML = `<span style="color:#ff6b6b;">エラー: ${esc(e.message)}</span>`;
    }
}

function renderKaimeData(data, area) {
        // 選択行のハイライト
        document.querySelectorAll('.w5-selected-row').forEach(el => el.classList.remove('w5-selected-row'));
        const blocks = data.picks.map(p => {
            p.horses.forEach(h => document.getElementById(`r${p.idx}h${h.num}`)?.classList.add('w5-selected-row'));
            const chips = p.horses.map(h => {
                const pop = h.pop ? ` / ${esc(h.pop)}人気` : '';
                const wp = h.win_prob != null ? ` / 勝率${(h.win_prob * 100).toFixed(0)}%` : '';
                return `<span class="w5-horse-chip"><b>${esc(h.num)}</b> ${esc(h.name)} (${h.score}${pop}${wp})</span>`;
            }).join('');
            const cov = p.coverage != null ? `カバー率 ${(p.coverage * 100).toFixed(1)}%` : '';
            const axisBadge = p.is_axis
                ? '<span class="upset-badge" style="background:#1976d2;color:#fff;">軸 1点</span>' : '';
            return `<div class="w5-pick-row">
                <span class="w5-race-head">WIN5-${p.idx + 1} ${esc(p.venue)}</span>
                ${upsetBadge(p.upset_rank)} ${axisBadge} <b>${p.k}頭</b>
                <span style="color:var(--text-muted);font-size:12px;">${cov}</span>
                <div class="w5-pick-horses">${chips}</div>
            </div>`;
        }).join('');
        let refLine = '';
        if (data.est_reference) {
            const [med, p75] = data.est_reference;
            const est = data.est_hit_rate;
            const level = est >= p75 ? '<b style="color:#66bb6a;">高め (上位25%圏)</b>'
                        : est >= med ? '中央値以上' : '<b style="color:#f5a742;">低め (中央値未満)</b>';
            refLine = `<div class="w5-est">今週の確信度: ${level}
                （2025年実測: 中央値${(med*100).toFixed(1)}% / 上位25% ${(p75*100).toFixed(1)}%。
                ※堅い週ほど配当は安い傾向 — 見送り判断の参考値）</div>`;
        }
        const skipBanner = data.skip_recommended
            ? `<div style="border:1px solid #d32f2f;background:rgba(211,47,47,0.12);border-radius:8px;
                 padding:8px 12px;margin:8px 0;font-weight:bold;">
                 ⚠️ 見送り推奨: 推定的中率${(data.est_hit_rate*100).toFixed(2)}% が
                 設定基準${(data.skip_threshold*100).toFixed(1)}% を下回っています</div>`
            : '';
        area.innerHTML = `
            <div class="w5-formula">${esc(data.formula)} <span style="font-size:13px;color:var(--text-muted);">(上限${data.budget}点)</span></div>
            ${skipBanner}
            <div class="w5-est">推定的中率: ${(data.est_hit_rate * 100).toFixed(2)}%
                ${data.alloc_method === 'prob'
                    ? '(レース固有のML勝率分布に基づく配分)'
                    : '(2024-2025バックテストのカバレッジ実測に基づく)'}</div>
            ${refLine}
            <div style="margin-top:10px;">${blocks}</div>`;
}

// ── STEP 4: 締切前の自動再計算 ──────────────────────────
let watchTimer = null;

async function armWatch() {
    const st = document.getElementById('watchStatus');
    const urls = [];
    for (let i = 0; i < 5; i++) {
        const u = (document.getElementById(`url${i}`)?.value || '').trim();
        if (!u) { st.textContent = `WIN5-${i + 1} のURLが未入力です (STEP1を先に)`; return; }
        urls.push(u);
    }
    const times = raceList.map(r => r.time).filter(t => /^\d{1,2}:\d{2}$/.test(t || ''));
    const firstTime = times.sort()[0];
    if (!firstTime) { st.textContent = '発走時刻が取得できていません (STEP1を再実行)'; return; }
    if ('Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
    }
    const pts = document.querySelector('input[name="pts"]:checked').value;
    const singleAxis = document.getElementById('singleAxis').checked;
    const res = await fetch('api/win5_watch', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({urls, first_time: firstTime, points: Number(pts), single_axis: singleAxis})
    });
    const d = await res.json();
    if (d.error) { st.textContent = 'エラー: ' + d.error; return; }
    st.textContent = `予約済み: 1レース目 ${d.first_time} 発走の15分前に自動再計算します (このタブを開いたままに)`;
    clearInterval(watchTimer);
    watchTimer = setInterval(pollWatch, 30000);
}

async function pollWatch() {
    try {
        const d = await (await fetch('api/win5_watch')).json();
        const st = document.getElementById('watchStatus');
        if (d.status === 'running') st.textContent = '再計算中... (オッズ再取得)';
        if (d.status === 'error') { st.textContent = 'エラー: ' + d.error; clearInterval(watchTimer); }
        if (d.status === 'done' && d.result) {
            clearInterval(watchTimer);
            st.textContent = `再計算完了 (${d.updated_at} 時点のオッズ)`;
            renderKaimeData(d.result, document.getElementById('watchArea'));
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('⏰ WIN5 締切前の最終買い目', {
                    body: `${d.result.formula} / 推定的中率 ${(d.result.est_hit_rate * 100).toFixed(2)}%`,
                    tag: 'win5-watch'});
            }
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = 880; g.gain.value = 0.15;
                o.start(); o.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }
    } catch (e) { /* サーバー停止中など */ }
}
</script>
</body>
</html>
