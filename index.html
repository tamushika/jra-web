<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRA解析システム - Web Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>JRA解析システム <span class="badge">Web Edition</span></h1>
            
            <div class="controls">
                <div class="input-group">
                    <input type="text" id="urlInput" placeholder="JRA 詳細出馬表のURLを入力してください..." 
                           value="https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0108202601030420260110/19">
                    <select id="modeSelect">
                        <option value="簡易">簡易分析</option>
                        <option value="詳細">詳細分析</option>
                    </select>
                    <button id="searchBtn" class="primary-btn">解析開始</button>
                    <button id="getUrlBtn" class="secondary-btn">最新URL取得 (未実装)</button>
                </div>
                <div class="status-panel">
                    <div id="raceInfo" class="race-label">【待機中】URLを入力して解析開始を押してください。</div>
                    <div id="babaInfo" class="baba-label">馬場情報：未取得</div>
                </div>
            </div>
        </header>

        <section class="matrix-section">
            <div class="matrix-header">全レース・マトリックス</div>
            <div id="matrixContainer" class="matrix-container">
                <div class="empty-state">待機中...</div>
            </div>
            <div class="criteria-container" id="criteriaContainer">
                <strong>【好走条件】</strong>
                <div id="criteriaList">該当なし</div>
            </div>
        </section>

        <main class="data-section">
            <div class="tabs">
                <button class="tab-btn active" data-target="tab-horses">出走馬データ</button>
                <button class="tab-btn" data-target="tab-history">過去戦績表示</button>
                <button class="tab-btn" data-target="tab-ultra">ウルトラ判定詳細</button>
                <button class="tab-btn" data-target="tab-ai">AI予想</button>
            </div>

            <div class="tab-content active" id="tab-horses">
                <div class="table-container">
                    <table id="horsesTable">
                        <thead>
                            <tr>
                                <th>枠</th>
                                <th>番</th>
                                <th>判定</th>
                                <th>オッズ</th>
                                <th>人気</th>
                                <th>間隔</th>
                                <th>馬名</th>
                                <th>性齢</th>
                                <th>脚質</th>
                                <th>斤量</th>
                                <th>騎手</th>
                                <th>所属</th>
                                <th>父</th>
                                <th>母父</th>
                            </tr>
                        </thead>
                        <tbody id="horsesTbody">
                            <!-- JS will populate -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tab-content" id="tab-history">
                <div class="history-select">
                    <label for="historyHorseSelect">馬を選択:</label>
                    <select id="historyHorseSelect"></select>
                </div>
                <div class="table-container">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>履歴</th><th>日付</th><th>場所</th><th>コース</th><th>馬場</th>
                                <th>斤量</th><th>騎手</th><th>レース名</th><th>通過順</th><th>上がり</th>
                                <th>タイム</th><th>人気</th><th>着順</th><th>頭数</th><th>馬体重</th>
                            </tr>
                        </thead>
                        <tbody id="historyTbody">
                            <!-- JS will populate -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tab-content" id="tab-ultra">
                <pre class="log-area" id="ultraDetails">ここにウルトラ判定の詳細が出力されます。</pre>
            </div>

            <div class="tab-content" id="tab-ai">
                <div class="control-row">
                    <input type="password" id="aiPassword" placeholder="アクセスパスワード" style="padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: white; width: 200px;">
                    <button class="primary-btn highlight" id="runAiBtn">AI予想を実行する</button>
                    <span id="aiStatus"></span>
                </div>
                <pre class="log-area" id="aiResult">事前にGEMINI_API_KEY環境変数が必要です。またはAPIリクエスト時にキーを含めてください。</pre>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <div id="loadingText">解析中... (JRAサイトへアクセスしています)</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
