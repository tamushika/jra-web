<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期待値レース監視</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .ev-container { max-width: 1100px; margin: 0 auto; padding: 16px; }
        .ev-section { background: rgba(0,0,0,0.25); border: 1px solid var(--border-color);
                      border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .ev-step-title { font-size: 16px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .ev-progress { color: var(--text-muted); margin-left: 10px; }
        .ev-race { border: 1px solid var(--border-color); border-radius: 8px;
                   padding: 10px 14px; margin-bottom: 8px; }
        .ev-race.has-pick { border-color: #f5c842; background: rgba(245,200,66,0.06); }
        .ev-race.finished { opacity: 0.45; }
        .ev-race-head { font-weight: bold; }
        .ev-chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
        .ev-chip { background: rgba(255,255,255,0.08); border: 1px solid var(--border-color);
                   border-radius: 6px; padding: 3px 10px; font-size: 13px; }
        .ev-chip b { color: var(--primary); }
        .ev-chip .ev-val { color: #f5c842; font-weight: bold; }
        .ev-badge { display: inline-block; padding: 1px 8px; border-radius: 10px;
                    font-weight: bold; font-size: 11px; margin-left: 4px; }
        .ev-badge-web { background: #1976d2; color: #fff; }
        .ev-badge-stage { background: #d32f2f; color: #fff; }
        .ev-meta { color: var(--text-muted); font-size: 12px; }
        .ev-alert-log { max-height: 220px; overflow-y: auto; font-size: 13px; }
        .ev-alert-row { padding: 6px 8px; border-bottom: 1px solid var(--border-color); }
        .ev-none { color: var(--text-muted); font-size: 12px; margin-left: 8px; }
        .ev-summary { font-size: 14px; margin: 8px 0; }
        .ev-summary b { color: #f5c842; font-size: 18px; }
        select, input[type=checkbox] { accent-color: var(--primary); }
        .ev-select { background: var(--bg-color, #222); color: var(--text-color, #eee);
                     border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 8px; }
        .ev-grid { width: 100%; border-collapse: collapse; }
        .ev-grid th, .ev-grid td { border: 1px solid var(--border-color);
                                   padding: 3px 5px; vertical-align: top; }
        .ev-grid th { background: rgba(255,255,255,0.06); font-size: 13px; }
        .ev-cell { font-size: 12px; border-radius: 6px; padding: 2px 4px; }
        .ev-cell.has-pick { background: rgba(245,200,66,0.12);
                            outline: 1px solid #f5c842; }
        .ev-cell.finished { opacity: 0.4; }
        .ev-cell-head { font-size: 11px; color: var(--text-muted); }
        .ev-cell-horse { margin-top: 2px; line-height: 1.4; }
        .ev-cell-horse b { color: var(--primary); }
        .ev-h-top { opacity: 0.75; }
    </style>
</head>
<body>
<div class="ev-container">
    <h2 style="margin: 12px 0;">期待値レース監視
        <span style="font-size:13px;color:var(--text-muted);">Web版スコア(回収率) × MLスコア(的中率) / ローカル専用</span>
    </h2>

    <div class="ev-section">
        <div class="ev-step-title">解析 &amp; 監視設定</div>
        <div style="margin-bottom:10px;">
            EV閾値 (ML勝率×オッズ):
            <select id="evTh" class="ev-select">
                <option value="1.0">1.0以上</option>
                <option value="1.1">1.1以上</option>
                <option value="1.2">1.2以上</option>
                <option value="1.3" selected>1.3以上 (推奨: 単勝回収158.6%/100.1%)</option>
                <option value="1.5">1.5以上</option>
            </select>
            <button class="primary-btn" id="notifBtn" onclick="enableNotif()" style="margin-left:10px;">🔔 通知を許可</button>
            <span id="notifState" class="ev-meta"></span>
        </div>
        <button class="primary-btn" id="startBtn" onclick="startAnalyze()">解析開始 (本日の全レース)</button>
        <span class="ev-progress" id="progress"></span>
        <div id="warnBanner" style="display:none;border:1px solid #f57c00;background:rgba(245,124,0,0.12);
             border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px;"></div>
        <div class="ev-meta" style="margin-top:8px;">
            発走15分前と5分前にオッズを自動更新し、期待値馬がいればブラウザ通知します。<b>このタブを開いたままにしてください。</b>
        </div>
    </div>

    <div class="ev-section">
        <div class="ev-step-title">🔔 通知ログ</div>
        <div class="ev-meta" style="margin-bottom:6px;">
            💡 買い方ガイド: <b>単勝+複勝の併用</b>が検証上最も堅い (EV≥1.3: 単勝回収158.6%/100.1%、複勝は両年102-103%)。
            通知内容はNeonに自動記録され、<code>python ev_log_report.py</code> で実測回収率を確認できます。
        </div>
        <div class="ev-alert-log" id="alertLog"><span class="ev-meta">まだ通知はありません</span></div>
    </div>

    <div class="ev-section">
        <div class="ev-step-title">本日のレースと期待値ピックアップ</div>
        <div class="ev-summary" id="summary"></div>
        <div id="raceArea" style="margin-top:10px;"></div>
    </div>
</div>

<script>
let lastAlertId = 0;
let stateCache = null;
let pollTimer = null;

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── 通知 ─────────────────────────────────────────────
function updateNotifState() {
    const el = document.getElementById('notifState');
    if (!('Notification' in window)) { el.textContent = 'このブラウザは通知非対応'; return; }
    el.textContent = Notification.permission === 'granted' ? '通知: 許可済み ✅'
                   : Notification.permission === 'denied' ? '通知: ブロック中 (ブラウザ設定で許可してください)'
                   : '通知: 未許可';
}
async function enableNotif() {
    if ('Notification' in window) await Notification.requestPermission();
    updateNotifState();
}
function beep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.15;
        o.start(); o.stop(ctx.currentTime + 0.5);
    } catch (e) {}
}
function notify(alert) {
    const title = `⏰ ${alert.stage}分前 期待値あり: ${alert.label}`;
    const body = alert.picks.map(p =>
        `${p.num}番 ${p.name} EV${p.ev} (勝率${(p.win_prob*100).toFixed(0)}%×${p.odds}倍)${p.web_value ? ' [Web妙味]' : ''}`
    ).join('\n') + '\n※単勝+複勝の併用が検証上最も堅い';
    if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body, tag: `ev-${alert.rid}-${alert.stage}` });
    }
    beep();
}

// ── 解析開始・ポーリング ──────────────────────────────
async function startAnalyze() {
    document.getElementById('startBtn').disabled = true;
    try {
        const res = await fetch('/api/analyze_start', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ev_threshold: parseFloat(document.getElementById('evTh').value) })
        });
        const d = await res.json();
        if (d.error) { document.getElementById('progress').textContent = d.error; }
        lastAlertId = 0;
        document.getElementById('alertLog').innerHTML = '<span class="ev-meta">まだ通知はありません</span>';
        schedulePoll(3000);
    } catch (e) {
        document.getElementById('progress').textContent = 'エラー: ' + e.message;
        document.getElementById('startBtn').disabled = false;
    }
}

function schedulePoll(ms) {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, ms);
}

async function poll() {
    try {
        const st = await (await fetch('/api/state')).json();
        stateCache = st;
        const p = document.getElementById('progress');
        if (st.status === 'analyzing') {
            p.textContent = `解析中... ${st.progress.done}/${st.progress.total}`;
            document.getElementById('startBtn').disabled = true;
        } else if (st.status === 'error') {
            p.textContent = 'エラー: ' + st.error;
            document.getElementById('startBtn').disabled = false;
        } else if (st.status === 'ready') {
            p.textContent = `監視中 (${st.started_at}に解析、EV閾値${st.params.ev_threshold})`;
            document.getElementById('startBtn').disabled = false;
        } else {
            p.textContent = '';
            document.getElementById('startBtn').disabled = false;
        }
        const wb = document.getElementById('warnBanner');
        if (st.warning) { wb.style.display = 'block'; wb.textContent = st.warning; }
        else { wb.style.display = 'none'; }
        render();

        const al = await (await fetch('/api/alerts?after=' + lastAlertId)).json();
        for (const a of al.alerts) {
            lastAlertId = Math.max(lastAlertId, a.id);
            appendAlertLog(a);
            notify(a);
        }
    } catch (e) { /* サーバー停止中など */ }
    schedulePoll(stateCache && stateCache.status === 'analyzing' ? 3000 : 20000);
}

function appendAlertLog(a) {
    const log = document.getElementById('alertLog');
    if (log.querySelector('.ev-meta')) log.innerHTML = '';
    const picks = a.picks.map(p =>
        `<b>${esc(p.num)}</b> ${esc(p.name)} <span class="ev-val">EV${esc(p.ev)}</span>` +
        ` (勝率${(p.win_prob*100).toFixed(0)}%×${esc(p.odds)}倍)` +
        (p.web_value ? '<span class="ev-badge ev-badge-web">Web妙味</span>' : '')
    ).join(' / ');
    log.insertAdjacentHTML('afterbegin',
        `<div class="ev-alert-row">[${esc(a.ts)}] <span class="ev-badge ev-badge-stage">${esc(a.stage)}分前</span>
         <b>${esc(a.label)}</b> — ${picks}</div>`);
}

// ── レース一覧描画 ────────────────────────────────────
function timeVal(t) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
    return m ? (+m[1]) * 60 + (+m[2]) : 9999;
}

function horseLine(h, picked) {
    const evTxt = h.ev != null ? `EV${h.ev}`
                : h.win_prob != null ? `勝率${(h.win_prob * 100).toFixed(0)}%` : '';
    const sub = h.odds && h.ev != null
        ? `<span class="ev-meta">(${(h.win_prob * 100).toFixed(0)}%×${esc(h.odds)}倍)</span>` : '';
    return `<div class="ev-cell-horse ${picked ? 'ev-h-pick' : 'ev-h-top'}">
        ${picked ? '' : '<span class="ev-meta">最上位: </span>'}<b>${esc(h.num)}</b> ${esc(h.name)}
        <span class="${picked ? 'ev-val' : 'ev-meta'}">${evTxt}</span> ${sub}
        ${h.web_value ? '<span class="ev-badge ev-badge-web">W</span>' : ''}${h.grade ? ' ' + esc(h.grade) : ''}
    </div>`;
}

function cellHtml(r) {
    const picks = r.horses.filter(h => h.picked);
    let body;
    if (picks.length) {
        body = picks.map(h => horseLine(h, true)).join('');
    } else {
        // 期待値なしレースも EV最上位 (オッズ未発売時は勝率最上位) を表示
        const withEv = r.horses.filter(h => h.ev != null);
        let top = null;
        if (withEv.length) top = withEv.reduce((a, b) => (a.ev >= b.ev ? a : b));
        else {
            const withP = r.horses.filter(h => h.win_prob != null);
            if (withP.length) top = withP.reduce((a, b) => (a.win_prob >= b.win_prob ? a : b));
        }
        body = top ? horseLine(top, false) : '<span class="ev-meta">-</span>';
    }
    const marks = (r.checked15 ? ' ✓15' : '') + (r.checked5 ? ' ✓5' : '');
    const oddsBadge = r.odds_ok === false
        ? ' <span class="ev-badge" style="background:#f57c00;color:#fff;">オッズ未</span>' : '';
    return `<div class="ev-cell ${picks.length ? 'has-pick' : ''} ${r.finished ? 'finished' : ''}">
        <div class="ev-cell-head">${esc(r.start_time)}<span class="ev-meta">${marks}</span>${oddsBadge}</div>
        ${body}</div>`;
}

function render() {
    if (!stateCache) return;
    const races = stateCache.races || [];
    const nPick = races.filter(r => r.n_picked > 0).length;
    const dayLabel = races.length && races[0].day_label ? ` (${races[0].day_label})` : '';
    document.getElementById('summary').innerHTML =
        races.length ? `期待値馬のいるレース: <b>${nPick}</b> / ${races.length}レース${esc(dayLabel)}
            <span class="ev-meta">金枠=期待値馬あり / その他のレースはEV最上位馬を薄く表示</span>` : '';
    const area = document.getElementById('raceArea');
    if (!races.length) { area.innerHTML = ''; return; }

    // 会場ごとの列 (初戦の発走が早い順)、行はレース番号で揃える
    const byVenue = new Map();
    for (const r of races) {
        if (!byVenue.has(r.venue)) byVenue.set(r.venue, new Map());
        byVenue.get(r.venue).set(r.race_num, r);
    }
    const venues = [...byVenue.keys()].sort((a, b) => {
        const first = m => Math.min(...[...m.values()].map(r => timeVal(r.start_time)));
        return first(byVenue.get(a)) - first(byVenue.get(b));
    });
    const maxR = Math.max(...races.map(r => r.race_num || 0));
    let html = '<div style="overflow-x:auto;"><table class="ev-grid"><tr><th style="width:34px;"></th>' +
        venues.map(v => `<th>${esc(v)}</th>`).join('') + '</tr>';
    for (let rn = 1; rn <= maxR; rn++) {
        html += `<tr><th>${rn}R</th>`;
        for (const v of venues) {
            const r = byVenue.get(v).get(rn);
            html += `<td>${r ? cellHtml(r) : ''}</td>`;
        }
        html += '</tr>';
    }
    area.innerHTML = html + '</table></div>';
}

updateNotifState();
schedulePoll(500);
</script>
</body>
</html>
